<!DOCTYPE html>
<html>
<head>
  <title>cTa ChAoS</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050812;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="city"></canvas>

  <script>
    const canvas = document.querySelector("#city");
    const ctx = canvas.getContext("2d");

    let w = window.innerWidth;
    let h = window.innerHeight;
    let t = 0;

    canvas.width = w;
    canvas.height = h;

    let trains = [];
    let trainPositions = [];
    let bursts = [];
    let echoes = [];

    const workerURL = "https://wild-wood-123d.sandy-zhengg23.workers.dev";

    const stationIds = [
      41490, // red - harrison
      40890, // blue - o'hare
      41290, // brown - kimball
      40280, // green - central
      40930, // orange - midway
      40050, // purple - davis
      40580, // pink - 54th/cermak
      40140  // yellow - dempster skokie
    ];

    const routeColors = {
      Red: "rgba(198, 12, 48, 0.85)",
      Blue: "rgba(0, 161, 222, 0.85)",
      Brn: "rgba(98, 54, 27, 0.85)",
      G: "rgba(0, 155, 58, 0.85)",
      Org: "rgba(249, 70, 28, 0.85)",
      P: "rgba(82, 35, 152, 0.85)",
      Pink: "rgba(226, 126, 166, 0.85)",
      Y: "rgba(249, 227, 0, 0.85)"
    };

    const zoneColors = {
      "41490": "rgba(198, 12, 48, 0.08)",
      "40890": "rgba(0, 161, 222, 0.08)",
      "41290": "rgba(98, 54, 27, 0.08)",
      "40280": "rgba(0, 155, 58, 0.08)",
      "40930": "rgba(249, 70, 28, 0.08)",
      "40050": "rgba(82, 35, 152, 0.08)",
      "40580": "rgba(226, 126, 166, 0.08)",
      "40140": "rgba(249, 227, 0, 0.08)"
    };

    const hiddenGems = [
      { x: 0.18, y: 0.18, color: "rgba(255,255,255,0.8)", type: "rings" },
      { x: 0.50, y: 0.50, color: "rgba(249,227,0,0.8)", type: "burst" },
      { x: 0.82, y: 0.20, color: "rgba(82,35,152,0.8)", type: "glitch" },
      { x: 0.72, y: 0.82, color: "rgba(0,161,222,0.8)", type: "rings" }
    ];

    function getStationZones() {
      return {
        "41490": { x: w * 0.18, y: h * 0.25, radius: 80 },
        "40890": { x: w * 0.42, y: h * 0.20, radius: 85 },
        "41290": { x: w * 0.68, y: h * 0.22, radius: 80 },
        "40280": { x: w * 0.22, y: h * 0.50, radius: 85 },
        "40930": { x: w * 0.48, y: h * 0.50, radius: 85 },
        "40050": { x: w * 0.75, y: h * 0.50, radius: 85 },
        "40580": { x: w * 0.35, y: h * 0.78, radius: 85 },
        "40140": { x: w * 0.62, y: h * 0.78, radius: 80 }
      };
    }

    async function getCTAData() {
      let allArrivals = [];

      for (const id of stationIds) {
        const response = await fetch(`${workerURL}?mapid=${id}`);
        const data = await response.json();

        if (data.ctatt.errCd === "0" && data.ctatt.eta) {
          allArrivals = allArrivals.concat(data.ctatt.eta);
        }
      }

      trains = allArrivals.map(cleanTrain);
      console.log("all trains:", trains);
    }

    function cleanTrain(train) {
      return {
        station: train.staNm,
        stationId: train.staId,
        route: train.rt,
        destination: train.destNm,
        arrivalTime: train.arrT,
        approaching: train.isApp === "1",
        delayed: train.isDly === "1",
        heading: Number(train.heading || Math.random() * 360)
      };
    }

    function getMood() {
      const hour = new Date().getHours();

      if ((hour >= 7 && hour <= 9) || (hour >= 16 && hour <= 18)) {
        return { fade: "rgba(5, 8, 18, 0.055)", speed: 0.05, chaos: 1.5 };
      }

      if (hour >= 22 || hour <= 5) {
        return { fade: "rgba(5, 8, 18, 0.12)", speed: 0.02, chaos: 0.7 };
      }

      return { fade: "rgba(5, 8, 18, 0.08)", speed: 0.03, chaos: 1 };
    }

    function drawZones() {
      const zones = getStationZones();

      for (const id in zones) {
        const zone = zones[id];

        ctx.globalAlpha = 1;
        ctx.fillStyle = zoneColors[id] || "rgba(255,255,255,0.04)";
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius * 1.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      const mood = getMood();

      ctx.fillStyle = mood.fade;
      ctx.fillRect(0, 0, w, h);

      t += mood.speed;
      trainPositions = [];

      drawZones();

      trains.forEach((train, index) => {
        drawTrain(train, index, mood);
      });

      drawBursts();
      drawEchoes();

      requestAnimationFrame(draw);
    }

    function drawTrain(train, index, mood) {
      const zones = getStationZones();
      const zone = zones[train.stationId];

      if (!zone) return;

      const color = routeColors[train.route] || "rgba(255, 255, 255, 0.7)";
      const angle = train.heading * Math.PI / 180;

      const driftX = Math.sin(t * 0.8 + index * 1.7 + angle) * zone.radius;
      const driftY = Math.cos(t * 0.6 + index * 2.1 + angle) * zone.radius;

      const jitterAmount = train.delayed ? 26 : 4 * mood.chaos;
      const jitterX = Math.random() * jitterAmount - jitterAmount / 2;
      const jitterY = Math.random() * jitterAmount - jitterAmount / 2;

      const pulse = train.approaching ? Math.sin(t * 6 + index) * 8 : 0;
      const size = 13 + pulse;

      const x = zone.x + driftX + jitterX;
      const y = zone.y + driftY + jitterY;

      trainPositions.push({
        x: x,
        y: y,
        size: size,
        color: color,
        train: train
      });

      for (let i = 1; i <= 8; i++) {
        const trailDist = i * 10;
        const trailX = x - Math.cos(angle) * trailDist;
        const trailY = y - Math.sin(angle) * trailDist;
        const fade = 1 - i / 9;

        ctx.globalAlpha = fade * 0.45;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(trailX, trailY, size * fade, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      for (let i = 0; i < 12; i++) {
        const spread = train.delayed ? 38 : 20;
        const dotX = x + Math.random() * spread - spread / 2;
        const dotY = y + Math.random() * spread - spread / 2;
        const dotSize = Math.random() * 3 + 1;

        ctx.globalAlpha = 0.28;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotSize, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.12;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, size + i * 9 + Math.sin(t * 4 + index) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    function handleClick(event) {
      const mouseX = event.offsetX;
      const mouseY = event.offsetY;

      for (const pos of trainPositions) {
        const distance = Math.hypot(mouseX - pos.x, mouseY - pos.y);

        if (distance < pos.size + 25) {
          bursts.push({
            x: pos.x,
            y: pos.y,
            color: pos.color,
            life: 45,
            maxLife: 45,
            delayed: pos.train.delayed,
            approaching: pos.train.approaching
          });

          return;
        }
      }

      for (const gem of hiddenGems) {
        const gemX = gem.x * w;
        const gemY = gem.y * h;
        const distance = Math.hypot(mouseX - gemX, mouseY - gemY);

        if (distance < 75) {
          echoes.push({
            x: gemX,
            y: gemY,
            color: gem.color,
            type: gem.type,
            life: 90,
            maxLife: 90
          });

          return;
        }
      }
    }

    function drawBursts() {
      for (let i = bursts.length - 1; i >= 0; i--) {
        const burst = bursts[i];
        const age = burst.maxLife - burst.life;
        const radius = age * (burst.delayed ? 5 : 3);
        const alpha = burst.life / burst.maxLife;

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = burst.color;
        ctx.lineWidth = burst.approaching ? 3 : 1.5;

        ctx.beginPath();
        ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2);
        ctx.stroke();

        for (let j = 0; j < 16; j++) {
          const angle = (Math.PI * 2 * j) / 16;
          const sparkX = burst.x + Math.cos(angle) * radius;
          const sparkY = burst.y + Math.sin(angle) * radius;

          ctx.beginPath();
          ctx.arc(sparkX, sparkY, burst.delayed ? 3 : 2, 0, Math.PI * 2);
          ctx.fillStyle = burst.color;
          ctx.fill();
        }

        ctx.globalAlpha = 1;

        burst.life--;

        if (burst.life <= 0) {
          bursts.splice(i, 1);
        }
      }
    }

    function drawEchoes() {
      for (let i = echoes.length - 1; i >= 0; i--) {
        const echo = echoes[i];
        const age = echo.maxLife - echo.life;
        const alpha = echo.life / echo.maxLife;

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = echo.color;
        ctx.lineWidth = 2;

        for (let j = 0; j < 4; j++) {
          const radius = age * 2 + j * 18;

          ctx.beginPath();
          ctx.arc(echo.x, echo.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (echo.type === "burst") {
          for (let j = 0; j < 18; j++) {
            const angle = (Math.PI * 2 * j) / 18;
            const radius = age * 3;
            const dotX = echo.x + Math.cos(angle) * radius;
            const dotY = echo.y + Math.sin(angle) * radius;

            ctx.beginPath();
            ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
            ctx.fillStyle = echo.color;
            ctx.fill();
          }
        }

        if (echo.type === "glitch") {
          for (let j = 0; j < 12; j++) {
            ctx.beginPath();
            ctx.moveTo(echo.x + Math.random() * 100 - 50, echo.y + Math.random() * 100 - 50);
            ctx.lineTo(echo.x + Math.random() * 100 - 50, echo.y + Math.random() * 100 - 50);
            ctx.stroke();
          }
        }

        ctx.globalAlpha = 1;

        echo.life--;

        if (echo.life <= 0) {
          echoes.splice(i, 1);
        }
      }
    }

    function resizeCanvas() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
    }

    window.addEventListener("resize", resizeCanvas);
    canvas.addEventListener("click", handleClick);

    getCTAData();
    setInterval(getCTAData, 60000);
    draw();
  </script>
</body>
</html>
